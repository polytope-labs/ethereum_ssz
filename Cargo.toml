[workspace]
members = [
    "ssz",
    "ssz_derive",
]
resolver = "2"

[workspace.package]
version = "0.10.4"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sigp/ethereum_ssz"
keywords = ["ethereum"]
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
ethereum_ssz = { version = "0.10.4", path = "ssz" }
ethereum_ssz_derive = { version = "0.10.4", path = "ssz_derive" }

[patch.crates-io]
ethereum_serde_utils = { git = "https://github.com/polytope-labs/ethereum_serde_utils", rev = "b67233cce50833e2082ebcb16a9971df063c7ecb" }
